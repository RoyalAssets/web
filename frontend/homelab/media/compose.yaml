name: homelab-media

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "$PUID:$PGID"
    environment:
      TZ: $TZ
    volumes:
      - ./jellyfin:/config
      - ./jellyfin/cache:/cache
      - "$DATA_ROOT:/data:ro"
    ports:
      - "8096:8096/tcp"
      - "7359:7359/udp"
    restart: unless-stopped

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: jellyseerr
    environment:
      TZ: $TZ
      PORT: "5055"
    volumes:
      - ./jellyseerr:/app/config
    ports:
      - "5055:5055"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5055/api/v1/settings/public"]
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      UMASK: "002"
    volumes:
      - ./prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      UMASK: "002"
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    volumes:
      - ./qbittorrent:/config
      - "$DATA_ROOT:/data"
    ports:
      - "8080:8080"
      - "6881:6881/tcp"
      - "6881:6881/udp"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      UMASK: "002"
    volumes:
      - ./radarr:/config
      - "$DATA_ROOT:/data"
    ports:
      - "7878:7878"
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      UMASK: "002"
    volumes:
      - ./sonarr:/config
      - "$DATA_ROOT:/data"
    ports:
      - "8989:8989"
    restart: unless-stopped
