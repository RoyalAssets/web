<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="35%" cy="28%" r="80%">
      <stop offset="0" stop-color="#29202a"/>
      <stop offset="1" stop-color="#09090d"/>
    </radialGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3ef"/>
      <stop offset=".5" stop-color="#ff9bc5"/>
      <stop offset="1" stop-color="#ff5f9f"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#bg)" stroke="#ffffff" stroke-opacity=".2" stroke-width="2"/>
  <circle cx="32" cy="32" r="23" fill="none" stroke="#ffc4dc" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="2 5">
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="6s" repeatCount="indefinite"/>
  </circle>
  <path d="M32 55 9.3 34.4C-2 22.8 6 7.1 19.4 9.3 25.5 10.3 29.7 14.2 32 20c2.3-5.8 6.5-9.7 12.6-10.7C58 7.1 66 22.8 54.7 34.4L32 55Z" fill="url(#heart)" filter="url(#glow)">
    <animate attributeName="opacity" values=".86;1;.86" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <path d="M17 22c1-4 4-6 8-6" fill="none" stroke="#ffffff" stroke-opacity=".65" stroke-width="2" stroke-linecap="round">
    <animate attributeName="opacity" values=".35;.8;.35" dur="1.8s" repeatCount="indefinite"/>
  </path>
